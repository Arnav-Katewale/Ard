# RoboDog configuration.
#
# Every tunable number lives here instead of in code.
#
# Values marked PLACEHOLDER have NOT been measured on the physical robot yet.
# They are reasonable starting values so the software can be validated in
# simulation; they must be replaced with measured values during hardware
# integration.
#
# Coordinate convention (body frame):
#   +x = forward, +y = left, +z = up
#   roll  = rotation about +x, positive = left side up / right side down
#   pitch = rotation about +y, positive = nose down   (right-hand rule)

[imu]
# Project IMU: MPU6050 (GY-521) on I2C (GPIO2/3). Its driver for this
# interface has not been written yet.
# axis_map[i] = which signed sensor axis gives body axis x, y, z.
# PLACEHOLDER until the physical mounting orientation is confirmed.
axis_map = ["+x", "+y", "+z"]
max_accel_ms2 = 156.9     # PLACEHOLDER: MPU6050's widest range (+/-16 g); the driver will set the range
max_gyro_dps = 2000.0     # PLACEHOLDER: MPU6050's widest range (+/-2000 deg/s)

[ultrasonic]
# HC-SR04 (5 V). Its Echo reaches GPIO24 through a 1 kOhm / 2 kOhm divider,
# per docs/wiring-map.html on the main branch. Not yet physically wired.
min_distance_cm = 2.0       # PLACEHOLDER: reliable range to be measured in calibration
max_distance_cm = 300.0     # PLACEHOLDER
timeout_s = 0.025
min_interval_s = 0.06       # ~60 ms between pings so old echoes die out
speed_of_sound_ms = 343.0   # dry air at ~20 C
# Set to true ONLY after measuring the wired divider output at the Pi: <= 3.3 V.
echo_voltage_safe = false
gpio_chip = 0               # PLACEHOLDER: check with `gpioinfo` on the Pi 5
trigger_pin = 23            # BCM numbering; matches the wiring map (physical pin 16)
echo_pin = 24               # BCM numbering; matches the wiring map (physical pin 18)

[servo_bus]
# This backend speaks LX-16A servo-level packets over serial (e.g. a BusLinker).
# The robot itself uses the Hiwonder USB HID controller; an HID backend is a
# planned integration step.
device = "/dev/ttyUSB0"       # PLACEHOLDER
echo = false                  # true only for Pi UART + half-duplex circuit wiring
max_joint_speed_dps = 120.0   # conservative software speed limit
min_move_time_ms = 20

# Joints. Angles are joint angles (see robodog/servos/joint.py):
#   hip   = abduction, rotation of the whole leg about the body x axis
#   upper = hip pitch, 0 = leg pointing straight down, positive = foot forward
#   knee  = knee bend, 0 = straight leg
# servo angle = servo_neutral_deg + direction * joint angle
# This 12-joint (3 per leg) software model predates reconciliation with the
# physical robot, which has 2 servos per leg (hip, knee) plus a head servo:
# FL 1/2, FR 3/4, RL 5/6, RR 7/8, head 9. Adapting to that is the next
# integration step.
# ALL ids, limits, neutrals and directions below are PLACEHOLDER values.
# Right legs are assumed mirrored (-1).

[[joints]]
name = "FL_hip"
servo_id = 1
min_deg = -25.0
max_deg = 25.0
servo_neutral_deg = 120.0
direction = 1

[[joints]]
name = "FL_upper"
servo_id = 2
min_deg = -60.0
max_deg = 80.0
servo_neutral_deg = 120.0
direction = 1

[[joints]]
name = "FL_knee"
servo_id = 3
min_deg = 20.0
max_deg = 140.0
servo_neutral_deg = 60.0
direction = 1

[[joints]]
name = "FR_hip"
servo_id = 4
min_deg = -25.0
max_deg = 25.0
servo_neutral_deg = 120.0
direction = -1

[[joints]]
name = "FR_upper"
servo_id = 5
min_deg = -60.0
max_deg = 80.0
servo_neutral_deg = 120.0
direction = -1

[[joints]]
name = "FR_knee"
servo_id = 6
min_deg = 20.0
max_deg = 140.0
servo_neutral_deg = 180.0
direction = -1

[[joints]]
name = "RL_hip"
servo_id = 7
min_deg = -25.0
max_deg = 25.0
servo_neutral_deg = 120.0
direction = 1

[[joints]]
name = "RL_upper"
servo_id = 8
min_deg = -60.0
max_deg = 80.0
servo_neutral_deg = 120.0
direction = 1

[[joints]]
name = "RL_knee"
servo_id = 9
min_deg = 20.0
max_deg = 140.0
servo_neutral_deg = 60.0
direction = 1

[[joints]]
name = "RR_hip"
servo_id = 10
min_deg = -25.0
max_deg = 25.0
servo_neutral_deg = 120.0
direction = -1

[[joints]]
name = "RR_upper"
servo_id = 11
min_deg = -60.0
max_deg = 80.0
servo_neutral_deg = 120.0
direction = -1

[[joints]]
name = "RR_knee"
servo_id = 12
min_deg = 20.0
max_deg = 140.0
servo_neutral_deg = 180.0
direction = -1

[calibration]
# Stationary IMU calibration acceptance thresholds.
# PLACEHOLDER: to be set from measured sensor noise during sensor calibration.
min_samples = 200
max_gyro_mean_dps = 0.2
max_level_error_deg = 0.5
max_gyro_std_dps = 0.5
max_accel_std_ms2 = 0.1

[geometry]
# PLACEHOLDER dimensions for the current 3-joint leg model; the physical legs
# (2 joints each) have not been measured yet.
body_length_mm = 200.0    # front-to-rear hip spacing
body_width_mm = 110.0     # left-to-right hip spacing
hip_offset_mm = 30.0      # sideways offset of the upper leg from the abduction axis
upper_leg_mm = 80.0
lower_leg_mm = 80.0

[stability]
window_s = 2.0
min_samples = 20
marginal_score = 0.5
unstable_score = 1.0
emergency_tilt_deg = 30.0   # PLACEHOLDER: stop everything beyond this tilt

# Each metric is divided by its reference ("just acceptable") value, so a score
# of 1.0 means "at the acceptable limit". Equal weights until walking data
# shows which metrics best predict a fall.
[stability.weights]
rms_pitch = 0.2
rms_roll = 0.2
peak_tilt = 0.2
gyro_variance = 0.2
accel_variance = 0.2

# PLACEHOLDER reference values, to be replaced from measured walking data.
[stability.references]
rms_pitch = 5.0          # deg
rms_roll = 5.0           # deg
peak_tilt = 12.0         # deg
gyro_variance = 400.0    # (deg/s)^2
accel_variance = 4.0     # (m/s^2)^2

# Baseline open-loop trot. PLACEHOLDER values until gait experiments are run.
[gait.base]
stride_length_mm = 60.0
step_height_mm = 25.0
cycle_time_s = 0.8
body_height_mm = 120.0
duty_factor = 0.6

# Trot: diagonal pairs move together, half a cycle apart.
[gait.phase_offsets]
FL = 0.0
RR = 0.0
FR = 0.5
RL = 0.5

[obstacle]
# PLACEHOLDER thresholds; to be revisited once the sensor's reliable range is measured.
caution_cm = 80.0
near_cm = 30.0
stop_cm = 15.0
hysteresis_cm = 5.0
max_invalid_readings = 5   # consecutive missed echoes before distance is "unknown"

# Adaptive gait prototype. Gains and limits are conservative PLACEHOLDER
# starting points, validated only in simulation so far.
[adaptive]
max_correction_rate_dps = 20.0    # body correction may change at most this fast
stride_rate_up_mm_s = 40.0        # lengthen stride slowly
stride_rate_down_mm_s = 150.0     # shorten stride quickly (safe direction)
step_height_rate_mm_s = 40.0
cycle_time_rate_s_per_s = 0.5
max_stride_mm = 80.0
max_step_height_mm = 40.0
min_cycle_time_s = 0.6
max_cycle_time_s = 1.5

[adaptive.roll_pid]
kp = 0.6
ki = 0.8
kd = 0.02
output_limit = 8.0        # deg, maximum body roll correction
integral_limit = 10.0

[adaptive.pitch_pid]
kp = 0.6
ki = 0.8
kd = 0.02
output_limit = 8.0        # deg, maximum body pitch correction
integral_limit = 10.0

[adaptive.obstacle_stride_scale]
CLEAR = 1.0
CAUTION = 0.7
NEAR = 0.4

[adaptive.obstacle_step_height_add_mm]
CLEAR = 0.0
CAUTION = 0.0
NEAR = 8.0

[adaptive.obstacle_cycle_time_scale]
CLEAR = 1.0
CAUTION = 1.0
NEAR = 1.25

[adaptive.stability_stride_scale]
STABLE = 1.0
MARGINAL = 0.8
UNSTABLE = 0.5
UNKNOWN = 0.7

[control_loop]
rate_hz = 50.0                  # PLACEHOLDER: achievable rate on the Pi not yet measured
ultrasonic_every_n_steps = 5    # 10 Hz ultrasonic at 50 Hz loop (>= 60 ms between pings)
max_imu_failures = 5            # consecutive failed IMU reads before emergency stop
max_consecutive_rejections = 10 # consecutive rejected joint commands before emergency stop

# Software validation scenario (simulated sensor input, toy body model).
# These values only define the simulated test; they are not robot measurements.
[simulation]
duration_s = 14.0
seed = 42
accel_noise_std = 0.05          # m/s^2
gyro_noise_std = 0.15           # deg/s
gyro_bias_dps = [1.2, -0.7, 0.3]
mounting_pitch_deg = 1.5        # simulated IMU mounting error, removed by calibration
mounting_roll_deg = -1.0
ultrasonic_noise_cm = 0.8
ultrasonic_dropout = 0.03
response_time_s = 0.25          # toy model: how fast body follows commanded correction
gait_sway_deg = 1.0             # toy model: body sway caused by stepping
roll_disturbance_deg = 6.0      # e.g. standing across a side slope
roll_disturbance_start_s = 2.0
roll_disturbance_end_s = 7.0
pitch_disturbance_deg = 4.0     # e.g. walking onto an incline
pitch_disturbance_start_s = 4.0
pitch_disturbance_end_s = 9.0
obstacle_start_cm = 150.0
obstacle_end_cm = 10.0
obstacle_approach_start_s = 6.0
obstacle_approach_end_s = 12.0
calibration_samples = 300
